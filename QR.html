<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコード – <?= eventName ?></title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      padding: 40px 48px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }
    #qrcode {
      display: inline-block;
      padding: 12px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 24px;
    }
    .url-box {
      font-size: 0.72rem;
      color: #555;
      word-break: break-all;
      background: #f9f9f9;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 20px;
    }
    .btn-print {
      display: inline-block;
      padding: 10px 28px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-print:hover { background: #357ab8; }
    @media print {
      body { background: #fff; }
      .card { box-shadow: none; }
      .btn-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>【<?= eventName ?>】<br>協賛申込みフォーム</h1>
    <p class="subtitle">QRコードからフォームにアクセスできます</p>
    <div id="qrcode" data-url="<?= url ?>"></div>
    <button class="btn-print" onclick="window.print()">印刷する</button>
  </div>
  <script>
    var qrEl = document.getElementById('qrcode');
    var qrUrl = qrEl.getAttribute('data-url');
    new QRCode(qrEl, {
      text: qrUrl,
      width: 240,
      height: 240,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L,
    });
  </script>
</body>
</html>
