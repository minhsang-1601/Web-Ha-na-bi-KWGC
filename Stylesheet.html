<style>
/* ─── Base ─────────────────────────────────────────────────────────────────── */

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 40px 20px;
    color: #333;

    background-color: #f3effa;
    background-image:
        radial-gradient(circle, rgba(160, 130, 200, 0.08) 1.5px, transparent 1.5px),
        radial-gradient(circle, rgba(230, 150, 180, 0.06)   2px,   transparent 2px),
        linear-gradient(135deg, #f3effa 0%, #e8eaf6 50%, #f5f0f6 100%);
    background-size: 50px 50px, 70px 70px, 100% 100%;
    background-position: 0 0, 25px 35px, 0 0;
}

/* ─── Form container ────────────────────────────────────────────────────────── */

.form-container {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    padding: 30px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(130, 110, 160, 0.12);
    box-sizing: border-box;
}

h2 {
    font-size: 1.4em;
    text-align: center;
    margin-top: 0;
    padding-bottom: 5px;
    border-bottom: 2px solid #333;
}

/* ─── Registration period banner ────────────────────────────────────────────── */

.registration-period {
    padding: 10px 15px;
    margin-bottom: 20px;
    background-color: #f0eaf8;
    border-left: 4px solid #826ea0;
    border-radius: 0 4px 4px 0;
    font-size: 0.95em;
    font-weight: bold;
    color: #4a3b68;
}

/* ─── Form fields ───────────────────────────────────────────────────────────── */

.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.furigana {
    font-size: 0.9em;
    color: #666;
}

.required-mark {
    font-size: 0.7em;
    font-style: italic;
    font-weight: normal;
    color: #d9534f;
    margin-left: 4px;
}

input[type="text"],
input[type="email"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

.form-note {
    display: block;
    margin-top: 4px;
    font-size: 0.78em;
    color: #8c8c8c;
}

.form-note i {
    font-style: italic;
    font-weight: bold;
    color: #555;
    padding-right: 2px;
}

/* ─── Sponsorship tier (radio group) ────────────────────────────────────────── */

.radio-group-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 30px;
    margin-top: 5px;
}

.radio-label {
    display: inline-flex;
    align-items: center;
    font-weight: normal;
    font-size: 0.95em;
    cursor: pointer;
}

.radio-label input[type="radio"] {
    margin-right: 6px;
    cursor: pointer;
}

/* 受付期間外の区分: 淡色＋無効化 */
.radio-label.kubun-off {
    opacity: 0.4;
    cursor: not-allowed;
}

.radio-label.kubun-off input[type="radio"] {
    cursor: not-allowed;
}

/* ─── Terms and conditions scroll box ──────────────────────────────────────── */

.terms-box {
    width: 100%;
    height: 150px;
    overflow-y: scroll;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #fcfcfc;
    box-sizing: border-box;
    font-size: 0.9em;
    color: #444;
}

/* ─── Agreement checkbox ────────────────────────────────────────────────────── */

.checkbox-group {
    margin-top: 10px;
}

.disabled-label {
    color: #999;
    cursor: not-allowed;
}

.checkbox-group label:not(.disabled-label) {
    color: #333;
    cursor: pointer;
}

/* ─── Submit button ─────────────────────────────────────────────────────────── */

button {
    width: 100%;
    padding: 10px 15px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 1em;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

/* ─── Responsive ────────────────────────────────────────────────────────────── */

/* GASのiframe内では @media が端末幅で発火しないため、
   実機幅で付与される html.scr-sm / html.scr-xs クラスで分岐する。 */
html.scr-sm body { padding: 0.5cm; }
html.scr-sm .form-container {
    max-width: none;
    width: 100%;
    margin: 0;
    padding: 20px 16px;
    border-radius: 8px;
}
html.scr-sm h2 { font-size: 1.2em; }

html.scr-xs .form-container { padding: 16px 12px; border-radius: 6px; }
html.scr-xs h2 { font-size: 1.1em; }
html.scr-xs input[type="text"],
html.scr-xs input[type="email"] { font-size: 1em; padding: 10px 8px; }
html.scr-xs button { padding: 13px 15px; font-size: 1em; }
html.scr-xs .radio-group-container { grid-template-columns: 1fr 1fr; gap: 10px 16px; }
html.scr-xs .terms-box { height: 180px; }
html.scr-xs .registration-period { font-size: 0.85em; }
</style>
